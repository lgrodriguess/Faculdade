<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-cadastro – PetMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
<a class="logo" href="index.html">PetMatch</a>
<nav aria-label="Principal">
<a href="index.html">Início</a>
<a href="sobre.html">Sobre nós</a>
<a href="cadastro.html" aria-current="page">Quero adotar</a>
</nav></div></header>
<main><section><div class="wrap">
<h2>Pré-cadastro de adotante</h2>

<!-- Regiões de aviso: ficam sempre na página (vazias) e o script.js preenche o texto -->
<div class="alerta alerta-erro" id="alerta-erro" role="alert"></div>
<div class="alerta alerta-ok" id="alerta-ok" role="status"></div>

<form id="form-adocao" action="#" method="post">
<fieldset><legend>Seus dados</legend>
<div class="campo">
<label for="nome">Nome completo</label>
<input type="text" id="nome" name="nome" autocomplete="name" required aria-describedby="erro-nome">
<small class="erro" id="erro-nome"></small>
</div>
<div class="campo">
<label for="email">E-mail</label>
<input type="email" id="email" name="email" autocomplete="email" placeholder="nome@exemplo.com" required aria-describedby="erro-email">
<small class="erro" id="erro-email"></small>
</div>
<div class="campo">
<label for="cpf">CPF</label>
<input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required aria-describedby="dica-cpf erro-cpf">
<small class="dica" id="dica-cpf">Usado apenas para identificar o termo de adoção.</small>
<small class="erro" id="erro-cpf"></small>
</div>
<div class="campo">
<label for="nascimento">Data de nascimento</label>
<input type="date" id="nascimento" name="nascimento" autocomplete="bday" required aria-describedby="dica-nascimento erro-nascimento">
<small class="dica" id="dica-nascimento">É preciso ter 18 anos ou mais para adotar.</small>
<small class="erro" id="erro-nascimento"></small>
</div>
<div class="campo">
<label for="telefone">Telefone (opcional)</label>
<input type="tel" id="telefone" name="telefone" inputmode="tel" maxlength="15" autocomplete="tel-national" placeholder="(32) 90000-0000" aria-describedby="erro-telefone">
<small class="erro" id="erro-telefone"></small>
</div>
<div class="campo">
<label for="cidade">Cidade</label>
<input type="text" id="cidade" name="cidade" autocomplete="address-level2" required aria-describedby="erro-cidade">
<small class="erro" id="erro-cidade"></small>
</div>
</fieldset>
<fieldset><legend>Sobre a adoção</legend>
<div class="campo">
<label for="pet">Pet de interesse</label>
<select id="pet" name="pet"><option>Thor</option><option>Mel</option><option>Bidu</option><option>Luna</option><option>Rex</option><option>Tom</option><option>Ainda não sei</option></select>
</div>
<div class="campo">
<label for="moradia">Onde você mora?</label>
<select id="moradia" name="moradia"><option>Casa com quintal</option><option>Casa sem quintal</option><option>Apartamento</option></select>
</div>
<div class="row" role="group" aria-label="Já teve pets?">
<span>Já teve pets?</span>
<label><input type="radio" name="pets" value="sim" checked> Sim</label>
<label><input type="radio" name="pets" value="nao"> Não</label>
</div>
<div class="campo">
<label for="motivo">Por que quer adotar?</label>
<textarea id="motivo" name="motivo" rows="4"></textarea>
</div>
</fieldset>
<div class="campo">
<label class="check" for="aceite"><input type="checkbox" id="aceite" name="aceite" required aria-describedby="erro-aceite"> Aceito receber contato da ONG sobre minha adoção.</label>
<small class="erro" id="erro-aceite"></small>
</div>
<button class="btn" type="submit">Enviar pré-cadastro</button>
</form>
</div></section></main>
<footer><div class="wrap"><p>PetMatch – adotar é um ato de amor. © 2026</p></div></footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
