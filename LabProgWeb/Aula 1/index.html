<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Aula 1</title>
    <style>
        button {
            background-color: red;
            color: white;
            padding: 50px 50px;
            border: none;
            cursor: pointer;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>
    <button onclick="mudarCor()">Se der azul, da o botico</button>
    <script>
        function mudarCor() {
            document.querySelector('button').style.backgroundColor = 'blue';

        }
    </script>
</body>        
</html>
